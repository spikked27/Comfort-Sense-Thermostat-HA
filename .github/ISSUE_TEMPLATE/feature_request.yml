name: Suggest an improvement
description: Suggest a feature or an improvement to setup, controls or documentation.
body:
  - type: textarea
    id: need
    attributes:
      label: What would you like to do?
      description: Describe the household use case or the part of the setup that is difficult.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested behavior
      description: How should Comfort Sense handle this?
