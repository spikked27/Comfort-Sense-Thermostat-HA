name: Validate
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python scripts/check_release.py
  home-assistant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: pip install pytest-homeassistant-custom-component 'homeassistant>=2026.10.0,<2026.11.0'
      - name: Install the frontend matching the tested HA release
        run: python -c "import importlib.resources as r, json, subprocess, sys; deps=json.loads(r.files('homeassistant.components.frontend').joinpath('manifest.json').read_text())['requirements']; subprocess.check_call([sys.executable,'-m','pip','install',*deps])"
      - run: python -m pytest ha_tests -v
  console:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --prefix /tmp/comfort-browser playwright@1.56.1
      - run: /tmp/comfort-browser/node_modules/.bin/playwright install --with-deps chromium
      - run: node scripts/console_smoke.cjs
        env:
          NODE_PATH: /tmp/comfort-browser/node_modules
