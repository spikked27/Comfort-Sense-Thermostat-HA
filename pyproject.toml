[project]
name = "Comfort-Sense-Thermostat-HA"
version = "0.5.1a1"
description = "Occupancy-aware PID heating with passive thermal identification"
requires-python = ">=3.12"
license = "MIT"

[project.optional-dependencies]
test-ha = ["pytest-homeassistant-custom-component"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["ha_tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 120
